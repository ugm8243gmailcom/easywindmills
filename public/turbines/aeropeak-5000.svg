<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <pattern id="grid-alpine" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="rgba(148, 163, 184, 0.08)" stroke-width="0.8"/>
    </pattern>
    <linearGradient id="grad-alpine" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0e1726"/>
      <stop offset="100%" stop-color="#070c14"/>
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="url(#grad-alpine)"/>
  <rect width="800" height="450" fill="url(#grid-alpine)"/>

  <!-- Mountain Contour Line -->
  <path d="M 40 400 L 260 380 L 400 370 L 560 385 L 760 410" fill="none" stroke="#64748b" stroke-width="1.5" stroke-dasharray="4,4"/>
  <text x="70" y="372" fill="#94a3b8" font-family="monospace" font-size="11">RIDGE ELEVATION: 2,150 m AMSL</text>

  <!-- Heavy Rock Anchor Foundation -->
  <rect x="365" y="370" width="70" height="35" fill="none" stroke="#94a3b8" stroke-width="2"/>
  <text x="445" y="392" fill="#94a3b8" font-family="monospace" font-size="10">POST-TENSIONED ROCK ANCHORS</text>

  <!-- Tower -->
  <polygon points="382,370 389,160 411,160 418,370" fill="none" stroke="#94a3b8" stroke-width="2"/>
  <line x1="385" y1="265" x2="415" y2="265" stroke="#475569" stroke-width="1"/>

  <!-- Nacelle (Cold Climate Insulated) -->
  <rect x="360" y="146" width="75" height="26" rx="3" fill="none" stroke="#38bdf8" stroke-width="2"/>
  <circle cx="360" cy="159" r="13" fill="none" stroke="#38bdf8" stroke-width="2"/>
  <circle cx="360" cy="159" r="4.5" fill="#38bdf8"/>
  <text x="366" y="140" fill="#38bdf8" font-family="monospace" font-size="9">HEATED NACELLE</text>

  <!-- Blades (145m Rotor Diameter with Electro-thermal De-icing indication) -->
  <path d="M 360 159 C 358 120, 350 50, 354 30 C 359 30, 364 80, 362 159 Z" fill="none" stroke="#f1f5f9" stroke-width="2"/>
  <path d="M 360 159 C 330 185, 250 235, 225 255 C 228 260, 295 220, 360 159 Z" fill="none" stroke="#f1f5f9" stroke-width="2"/>
  <path d="M 360 159 C 385 185, 465 235, 490 255 C 493 250, 425 210, 360 159 Z" fill="none" stroke="#f1f5f9" stroke-width="2"/>

  <!-- Leading edge heat trace line on top blade -->
  <path d="M 354 30 C 350 70, 355 120, 358 159" fill="none" stroke="#f59e0b" stroke-width="1.2" stroke-dasharray="2,2"/>
  <text x="210" y="70" fill="#f59e0b" font-family="monospace" font-size="10">DE-ICING RESISTIVE TRACE</text>
  <line x1="310" y1="67" x2="352" y2="67" stroke="#f59e0b" stroke-width="0.8"/>

  <!-- Dimension line: Hub Height 120m -->
  <line x1="325" y1="159" x2="325" y2="370" stroke="#38bdf8" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="317" y1="159" x2="333" y2="159" stroke="#38bdf8" stroke-width="1.5"/>
  <line x1="317" y1="370" x2="333" y2="370" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="240" y="270" fill="#38bdf8" font-family="monospace" font-size="11">HUB HEIGHT: 120 m</text>

  <!-- Dimension line: Rotor Diameter 145m -->
  <line x1="520" y1="30" x2="520" y2="255" stroke="#f1f5f9" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="512" y1="30" x2="528" y2="30" stroke="#f1f5f9" stroke-width="1.5"/>
  <line x1="512" y1="255" x2="528" y2="255" stroke="#f1f5f9" stroke-width="1.5"/>
  <text x="535" y="145" fill="#f1f5f9" font-family="monospace" font-size="11">ROTOR DIA: 145 m</text>

  <!-- Title Block -->
  <rect x="560" y="325" width="220" height="105" fill="rgba(15, 23, 42, 0.9)" stroke="#94a3b8" stroke-width="1"/>
  <text x="575" y="348" fill="#f1f5f9" font-family="sans-serif" font-weight="700" font-size="12">EASYWINDMILL AEROPEAK-5000</text>
  <text x="575" y="368" fill="#94a3b8" font-family="monospace" font-size="10">SPECIFICATION: IEC CLASS S (COLD)</text>
  <text x="575" y="384" fill="#94a3b8" font-family="monospace" font-size="10">RATED POWER: 5.0 MW HIGH-ALTITUDE</text>
  <text x="575" y="400" fill="#94a3b8" font-family="monospace" font-size="10">TEMP RATING: -45 C TO +40 C</text>
  <text x="575" y="416" fill="#10b981" font-family="monospace" font-size="10">STATUS: SCHEMATIC SPECIFICATION</text>
</svg>
