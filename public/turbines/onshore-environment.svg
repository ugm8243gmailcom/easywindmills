<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <pattern id="grid-onshore" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="rgba(15, 23, 42, 0.06)" stroke-width="0.8"/>
    </pattern>
  </defs>

  <rect width="800" height="450" fill="#f8fafc"/>
  <rect width="800" height="450" fill="url(#grid-onshore)"/>

  <!-- Classification Header -->
  <rect x="40" y="24" width="250" height="28" rx="4" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="1"/>
  <text x="52" y="42" fill="#0369a1" font-family="sans-serif" font-weight="700" font-size="11" letter-spacing="0.08em">INSTALLATION ENVIRONMENT: GROUP D</text>

  <!-- Rolling Hills Terrain Line -->
  <path d="M 40 370 Q 220 340 380 365 T 760 350 L 760 410 L 40 410 Z" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/>
  <text x="60" y="398" fill="#64748b" font-family="monospace" font-size="10">TERRESTRIAL SITE TOPOGRAPHY</text>

  <!-- Concrete Gravity Base Foundation -->
  <polygon points="330,365 470,365 490,400 310,400" fill="#cbd5e1" stroke="#334155" stroke-width="2"/>
  <line x1="310" y1="382" x2="490" y2="382" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="400" y="394" text-anchor="middle" fill="#0f172a" font-family="monospace" font-size="9" font-weight="700">REINFORCED SPREAD FOUNDATION</text>

  <!-- Tubular Steel Tower -->
  <polygon points="388,365 394,140 406,140 412,365" fill="#ffffff" stroke="#0f172a" stroke-width="2"/>

  <!-- Nacelle and 3-Blade Upwind Rotor -->
  <rect x="380" y="128" width="48" height="16" rx="3" fill="#ffffff" stroke="#0f172a" stroke-width="1.8"/>
  <circle cx="380" cy="136" r="8" fill="#0284c7"/>
  <!-- Blades -->
  <line x1="380" y1="136" x2="380" y2="50" stroke="#0f172a" stroke-width="2.5"/>
  <line x1="380" y1="136" x2="305" y2="180" stroke="#0f172a" stroke-width="2.5"/>
  <line x1="380" y1="136" x2="455" y2="180" stroke="#0f172a" stroke-width="2.5"/>

  <!-- Wind Shear Boundary Layer Gradient Profile -->
  <g transform="translate(140, 100)">
    <text x="0" y="0" fill="#0369a1" font-family="sans-serif" font-size="11" font-weight="700">Atmospheric Boundary Layer</text>
    <text x="0" y="16" fill="#64748b" font-family="sans-serif" font-size="9.5">Wind speed increases with altitude above ground shear</text>
    <line x1="0" y1="40" x2="80" y2="40" stroke="#0284c7" stroke-width="2"/>
    <polygon points="80,37 88,40 80,43" fill="#0284c7"/>
    <line x1="0" y1="80" x2="60" y2="80" stroke="#0284c7" stroke-width="1.8"/>
    <polygon points="60,77 68,80 60,83" fill="#0284c7"/>
    <line x1="0" y1="120" x2="40" y2="120" stroke="#0284c7" stroke-width="1.5"/>
    <polygon points="40,117 48,120 40,123" fill="#0284c7"/>
    <line x1="0" y1="160" x2="25" y2="160" stroke="#0284c7" stroke-width="1.2"/>
    <polygon points="25,157 32,160 25,163" fill="#0284c7"/>
  </g>

  <!-- Technical Annotation Box -->
  <rect x="540" y="240" width="220" height="110" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="555" y="264" fill="#0f172a" font-family="sans-serif" font-weight="700" font-size="12">Onshore Deployment</text>
  <text x="555" y="284" fill="#475569" font-family="sans-serif" font-size="10.5">- Concrete gravity spread footings</text>
  <text x="555" y="300" fill="#475569" font-family="sans-serif" font-size="10.5">- Local ridge and plain topography</text>
  <text x="555" y="316" fill="#475569" font-family="sans-serif" font-size="10.5">- Direct regional grid access</text>
  <text x="555" y="332" fill="#475569" font-family="sans-serif" font-size="10.5">- Road transport logistics limits</text>

  <text x="60" y="430" fill="#475569" font-family="sans-serif" font-size="10.5">
    Onshore turbines are sited on land, where hub heights must balance wind shear gains against terrain complexity and road transport constraints.
  </text>
</svg>
