<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <pattern id="grid-sky" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="rgba(16, 185, 129, 0.08)" stroke-width="0.8"/>
    </pattern>
    <linearGradient id="grad-rural" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0a1924"/>
      <stop offset="100%" stop-color="#06121a"/>
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="url(#grad-rural)"/>
  <rect width="800" height="450" fill="url(#grid-sky)"/>

  <!-- Ground Line -->
  <line x1="60" y1="390" x2="740" y2="390" stroke="#10b981" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="70" y="382" fill="#10b981" font-family="monospace" font-size="11" letter-spacing="1">GROUND DATUM (0.0 m)</text>

  <!-- Foundation Pad -->
  <polygon points="360,390 440,390 430,375 370,375" fill="none" stroke="#64748b" stroke-width="2"/>
  <text x="448" y="384" fill="#94a3b8" font-family="monospace" font-size="10">REINFORCED SLAB FOUNDATION</text>

  <!-- Tubular Steel Tower -->
  <polygon points="385,375 392,190 408,190 415,375" fill="none" stroke="#94a3b8" stroke-width="2"/>
  <line x1="388" y1="280" x2="412" y2="280" stroke="#475569" stroke-width="1"/>

  <!-- Nacelle -->
  <rect x="365" y="176" width="65" height="24" rx="3" fill="none" stroke="#10b981" stroke-width="2"/>
  <circle cx="365" cy="188" r="11" fill="none" stroke="#10b981" stroke-width="2"/>
  <circle cx="365" cy="188" r="4" fill="#10b981"/>

  <!-- Blades (82m Rotor Diameter with acoustic serrations notation) -->
  <path d="M 365 188 C 363 150, 358 100, 360 80 C 365 80, 368 120, 367 188 Z" fill="none" stroke="#f1f5f9" stroke-width="1.8"/>
  <path d="M 365 188 C 340 210, 275 250, 255 265 C 258 270, 310 235, 365 188 Z" fill="none" stroke="#f1f5f9" stroke-width="1.8"/>
  <path d="M 365 188 C 390 210, 455 250, 475 265 C 478 260, 420 225, 365 188 Z" fill="none" stroke="#f1f5f9" stroke-width="1.8"/>

  <!-- Dimension line: Hub Height 75m -->
  <line x1="330" y1="188" x2="330" y2="390" stroke="#10b981" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="322" y1="188" x2="338" y2="188" stroke="#10b981" stroke-width="1.5"/>
  <line x1="322" y1="390" x2="338" y2="390" stroke="#10b981" stroke-width="1.5"/>
  <text x="250" y="295" fill="#10b981" font-family="monospace" font-size="11">HUB HEIGHT: 75 m</text>

  <!-- Dimension line: Rotor Diameter 82m -->
  <line x1="510" y1="80" x2="510" y2="265" stroke="#f1f5f9" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="502" y1="80" x2="518" y2="80" stroke="#f1f5f9" stroke-width="1.5"/>
  <line x1="502" y1="265" x2="518" y2="265" stroke="#f1f5f9" stroke-width="1.5"/>
  <text x="525" y="175" fill="#f1f5f9" font-family="monospace" font-size="11">ROTOR DIA: 82 m</text>

  <!-- Title Block -->
  <rect x="560" y="325" width="220" height="105" fill="rgba(15, 23, 42, 0.9)" stroke="#10b981" stroke-width="1"/>
  <text x="575" y="348" fill="#10b981" font-family="sans-serif" font-weight="700" font-size="12">EASYWINDMILL SKYBREEZE-1500</text>
  <text x="575" y="368" fill="#94a3b8" font-family="monospace" font-size="10">SPECIFICATION: IEC CLASS IIIA</text>
  <text x="575" y="384" fill="#94a3b8" font-family="monospace" font-size="10">RATED POWER: 1.5 MW MICROGRID</text>
  <text x="575" y="400" fill="#94a3b8" font-family="monospace" font-size="10">NOISE LEVEL: 38.5 dBA (SERRATED)</text>
  <text x="575" y="416" fill="#10b981" font-family="monospace" font-size="10">STATUS: SCHEMATIC SPECIFICATION</text>
</svg>
