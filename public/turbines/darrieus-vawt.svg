<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <pattern id="grid-darrieus" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="rgba(15, 23, 42, 0.06)" stroke-width="0.8"/>
    </pattern>
  </defs>

  <!-- Clean Light Engineering Canvas -->
  <rect width="800" height="450" fill="#f8fafc"/>
  <rect width="800" height="450" fill="url(#grid-darrieus)"/>

  <!-- Classification Header -->
  <rect x="40" y="24" width="230" height="28" rx="4" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="1"/>
  <text x="52" y="42" fill="#0369a1" font-family="sans-serif" font-weight="700" font-size="11" letter-spacing="0.08em">ROTOR ORIENTATION: GROUP A</text>

  <!-- Ground Plane -->
  <line x1="60" y1="400" x2="740" y2="400" stroke="#64748b" stroke-width="2"/>
  <line x1="60" y1="408" x2="740" y2="408" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="4,4"/>
  <text x="60" y="424" fill="#64748b" font-family="monospace" font-size="10">GROUND LEVEL / FOUNDATION DATUM</text>

  <!-- Central Vertical Shaft -->
  <rect x="395" y="70" width="10" height="330" fill="#cbd5e1" stroke="#334155" stroke-width="1.5"/>
  <line x1="400" y1="50" x2="400" y2="410" stroke="#0284c7" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="415" y="65" fill="#0284c7" font-family="monospace" font-size="10">VERTICAL AXIS OF ROTATION</text>

  <!-- Curved Troposkein Blades (Eggbeater profile) -->
  <!-- Left Blade -->
  <path d="M 400 90 C 230 110, 210 320, 400 350 C 220 315, 240 115, 400 90 Z" fill="rgba(2, 132, 199, 0.08)" stroke="#0f172a" stroke-width="2.5"/>
  <!-- Right Blade -->
  <path d="M 400 90 C 570 110, 590 320, 400 350 C 580 315, 560 115, 400 90 Z" fill="rgba(2, 132, 199, 0.08)" stroke="#0f172a" stroke-width="2.5"/>

  <!-- Horizontal Blade Struts -->
  <line x1="280" y1="220" x2="520" y2="220" stroke="#475569" stroke-width="2"/>
  <circle cx="280" cy="220" r="4" fill="#0284c7"/>
  <circle cx="520" cy="220" r="4" fill="#0284c7"/>
  <circle cx="400" cy="220" r="4" fill="#334155"/>

  <!-- Top Bearing & Guy Wire Collars -->
  <rect x="390" y="80" width="20" height="12" rx="2" fill="#e2e8f0" stroke="#334155" stroke-width="1.5"/>
  <line x1="390" y1="85" x2="160" y2="400" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="5,3"/>
  <line x1="410" y1="85" x2="640" y2="400" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="5,3"/>
  <text x="175" y="380" fill="#64748b" font-family="monospace" font-size="9">GUY WIRE SUPPORT</text>

  <!-- Ground-Level Generator Housing -->
  <rect x="365" y="340" width="70" height="60" rx="4" fill="#ffffff" stroke="#0f172a" stroke-width="2"/>
  <rect x="375" y="352" width="50" height="36" fill="#e2e8f0" stroke="#0284c7" stroke-width="1.5"/>
  <text x="400" y="374" text-anchor="middle" fill="#0369a1" font-family="monospace" font-size="9" font-weight="700">GENERATOR</text>
  <text x="400" y="415" text-anchor="middle" fill="#334155" font-family="sans-serif" font-size="10" font-weight="600">Base Drivetrain</text>

  <!-- Omnidirectional Wind Vector Indicator -->
  <g transform="translate(100, 150)">
    <line x1="0" y1="0" x2="55" y2="0" stroke="#0284c7" stroke-width="2"/>
    <polygon points="55,-4 65,0 55,4" fill="#0284c7"/>
    <line x1="0" y1="18" x2="55" y2="18" stroke="#0284c7" stroke-width="2"/>
    <polygon points="55,14 65,18 55,22" fill="#0284c7"/>
    <text x="0" y="-8" fill="#0369a1" font-family="sans-serif" font-size="11" font-weight="700">Omnidirectional Inflow</text>
    <text x="0" y="38" fill="#64748b" font-family="sans-serif" font-size="9.5">No yaw mechanism required</text>
  </g>

  <!-- Technical Annotation Box -->
  <rect x="540" y="270" width="220" height="110" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="555" y="294" fill="#0f172a" font-family="sans-serif" font-weight="700" font-size="12">Darrieus Rotor Principles</text>
  <text x="555" y="314" fill="#475569" font-family="sans-serif" font-size="10.5">- Lift-based vertical-axis rotor</text>
  <text x="555" y="330" fill="#475569" font-family="sans-serif" font-size="10.5">- Curved troposkein aerofoil blades</text>
  <text x="555" y="346" fill="#475569" font-family="sans-serif" font-size="10.5">- Generator installed at tower base</text>
  <text x="555" y="362" fill="#475569" font-family="sans-serif" font-size="10.5">- Operates in any wind direction</text>
</svg>
