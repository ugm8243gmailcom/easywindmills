<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <pattern id="grid-gen" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="rgba(15, 23, 42, 0.06)" stroke-width="0.8"/>
    </pattern>
  </defs>

  <rect width="800" height="450" fill="#f8fafc"/>
  <rect width="800" height="450" fill="url(#grid-gen)"/>

  <!-- Classification Header -->
  <rect x="40" y="24" width="230" height="28" rx="4" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="1"/>
  <text x="52" y="42" fill="#0369a1" font-family="sans-serif" font-weight="700" font-size="11" letter-spacing="0.08em">GENERATOR TECHNOLOGY: GROUP C</text>

  <!-- DFIG Electrical Schematic Diagram -->
  <!-- Turbine Rotor / Shaft -->
  <rect x="60" y="210" width="110" height="20" fill="#cbd5e1" stroke="#0f172a" stroke-width="2"/>
  <text x="115" y="195" text-anchor="middle" fill="#0f172a" font-family="sans-serif" font-size="11" font-weight="700">Mechanical Input</text>
  <text x="115" y="245" text-anchor="middle" fill="#64748b" font-family="monospace" font-size="9">From Gearbox</text>

  <!-- Generator Housing -->
  <circle cx="270" cy="220" r="85" fill="#ffffff" stroke="#0f172a" stroke-width="2.5"/>
  <circle cx="270" cy="220" r="60" fill="rgba(2, 132, 199, 0.08)" stroke="#0284c7" stroke-width="2"/>
  <circle cx="270" cy="220" r="30" fill="#e2e8f0" stroke="#334155" stroke-width="1.5"/>
  <text x="270" y="215" text-anchor="middle" fill="#0f172a" font-family="sans-serif" font-size="11" font-weight="700">DFIG</text>
  <text x="270" y="232" text-anchor="middle" fill="#0369a1" font-family="monospace" font-size="9">Wound Rotor</text>

  <!-- Stator Direct Grid Connection (Upper Path: ~70% Power) -->
  <path d="M 270 135 L 270 100 L 580 100" fill="none" stroke="#0f172a" stroke-width="2.5"/>
  <text x="420" y="90" text-anchor="middle" fill="#0f172a" font-family="sans-serif" font-size="10.5" font-weight="700">Stator Direct Grid Connection (~70% Power)</text>
  <text x="420" y="115" text-anchor="middle" fill="#64748b" font-family="monospace" font-size="9">Direct 50/60 Hz Synchronized AC</text>

  <!-- Slip Rings (Rotor Connection) -->
  <rect x="330" y="214" width="24" height="12" fill="#e06b52" stroke="#0f172a" stroke-width="1"/>
  <text x="342" y="205" text-anchor="middle" fill="#e06b52" font-family="monospace" font-size="8.5" font-weight="700">SLIP RINGS</text>

  <!-- Partial-Scale Back-to-Back Converter (Lower Path: ~30% Power) -->
  <path d="M 354 220 L 400 220 L 400 290 L 430 290" fill="none" stroke="#0284c7" stroke-width="2"/>
  <rect x="430" y="260" width="130" height="60" rx="4" fill="#ffffff" stroke="#0284c7" stroke-width="2"/>
  <text x="495" y="285" text-anchor="middle" fill="#0369a1" font-family="sans-serif" font-size="10" font-weight="700">Partial-Scale</text>
  <text x="495" y="302" text-anchor="middle" fill="#0f172a" font-family="sans-serif" font-size="9.5">AC-DC-AC Converter (~30%)</text>

  <!-- Converter path to grid bus -->
  <path d="M 560 290 L 580 290 L 580 100" fill="none" stroke="#0284c7" stroke-width="2"/>

  <!-- Combined Grid Transformer -->
  <rect x="620" y="80" width="120" height="100" rx="6" fill="#ffffff" stroke="#0f172a" stroke-width="2"/>
  <circle cx="680" cy="115" r="18" fill="none" stroke="#0284c7" stroke-width="2"/>
  <circle cx="680" cy="145" r="18" fill="none" stroke="#0284c7" stroke-width="2"/>
  <text x="680" y="195" text-anchor="middle" fill="#0f172a" font-family="sans-serif" font-size="10.5" font-weight="700">Step-Up Transformer</text>
  <text x="680" y="210" text-anchor="middle" fill="#64748b" font-family="monospace" font-size="9">To Utility Grid</text>

  <path d="M 580 100 L 620 100" fill="none" stroke="#0f172a" stroke-width="2.5"/>

  <!-- Summary Footnote -->
  <text x="60" y="420" fill="#475569" font-family="sans-serif" font-size="10.5">
    In a DFIG system, the stator connects directly to the grid, while the wound rotor is controlled by a partial-scale converter allowing variable speed operation with lower power electronics cost.
  </text>
</svg>
