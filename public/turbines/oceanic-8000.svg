<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <pattern id="grid-ocean" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="rgba(56, 189, 248, 0.08)" stroke-width="0.8"/>
    </pattern>
    <linearGradient id="grad-sea" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0a192f"/>
      <stop offset="100%" stop-color="#050e1a"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#grad-sea)"/>
  <rect width="800" height="450" fill="url(#grid-ocean)"/>

  <!-- Waterline -->
  <line x1="60" y1="380" x2="740" y2="380" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="70" y="372" fill="#38bdf8" font-family="monospace" font-size="11" letter-spacing="1">MEAN SEA LEVEL (0.0 m)</text>

  <!-- Subsea Monopile / Transition Piece -->
  <rect x="375" y="380" width="50" height="60" fill="none" stroke="#64748b" stroke-width="2"/>
  <line x1="375" y1="410" x2="425" y2="410" stroke="#64748b" stroke-width="1.5" stroke-dasharray="2,2"/>
  <text x="435" y="415" fill="#94a3b8" font-family="monospace" font-size="10">SUBSEA MONOPILE (-35m)</text>

  <!-- Yellow Transition Piece -->
  <rect x="378" y="340" width="44" height="40" fill="none" stroke="#eab308" stroke-width="2"/>
  <text x="430" y="360" fill="#eab308" font-family="monospace" font-size="10">OFFSHORE TRANSITION PIECE</text>

  <!-- Tower -->
  <polygon points="380,340 388,140 412,140 420,340" fill="none" stroke="#94a3b8" stroke-width="2"/>
  <line x1="383" y1="240" x2="417" y2="240" stroke="#475569" stroke-width="1"/>

  <!-- Nacelle (Direct-Drive Ring) -->
  <rect x="360" y="125" width="80" height="28" rx="4" fill="none" stroke="#38bdf8" stroke-width="2"/>
  <circle cx="360" cy="139" r="14" fill="none" stroke="#38bdf8" stroke-width="2"/>
  <circle cx="360" cy="139" r="5" fill="#38bdf8"/>

  <!-- Blades (164m Rotor Diameter) -->
  <!-- Top Blade -->
  <path d="M 360 139 C 358 100, 352 40, 355 15 C 360 15, 365 70, 362 139 Z" fill="none" stroke="#f1f5f9" stroke-width="2"/>
  <!-- Bottom-Left Blade -->
  <path d="M 360 139 C 330 160, 240 215, 215 235 C 218 240, 290 200, 360 139 Z" fill="none" stroke="#f1f5f9" stroke-width="2"/>
  <!-- Bottom-Right Blade -->
  <path d="M 360 139 C 385 165, 460 230, 485 250 C 488 245, 430 185, 360 139 Z" fill="none" stroke="#f1f5f9" stroke-width="2"/>

  <!-- Dimension line: Hub Height -->
  <line x1="330" y1="139" x2="330" y2="380" stroke="#38bdf8" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="322" y1="139" x2="338" y2="139" stroke="#38bdf8" stroke-width="1.5"/>
  <line x1="322" y1="380" x2="338" y2="380" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="245" y="260" fill="#38bdf8" font-family="monospace" font-size="11">HUB HEIGHT: 140 m</text>

  <!-- Dimension line: Rotor Diameter -->
  <line x1="530" y1="15" x2="530" y2="250" stroke="#f1f5f9" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="522" y1="15" x2="538" y2="15" stroke="#f1f5f9" stroke-width="1.5"/>
  <line x1="522" y1="250" x2="538" y2="250" stroke="#f1f5f9" stroke-width="1.5"/>
  <text x="545" y="135" fill="#f1f5f9" font-family="monospace" font-size="11">ROTOR DIA: 164 m</text>

  <!-- Engineering Specs Title Block -->
  <rect x="560" y="325" width="220" height="105" fill="rgba(15, 23, 42, 0.9)" stroke="#38bdf8" stroke-width="1"/>
  <text x="575" y="348" fill="#38bdf8" font-family="sans-serif" font-weight="700" font-size="12">EASYWINDMILL OCEANIC-8000</text>
  <text x="575" y="368" fill="#94a3b8" font-family="monospace" font-size="10">SPECIFICATION: IEC CLASS IA</text>
  <text x="575" y="384" fill="#94a3b8" font-family="monospace" font-size="10">RATED POWER: 8.0 MW DIRECT-DRIVE</text>
  <text x="575" y="400" fill="#94a3b8" font-family="monospace" font-size="10">FOUNDATION: OFFSHORE MONOPILE</text>
  <text x="575" y="416" fill="#10b981" font-family="monospace" font-size="10">STATUS: SCHEMATIC SPECIFICATION</text>
</svg>
