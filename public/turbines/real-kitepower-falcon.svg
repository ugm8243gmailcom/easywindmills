<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <rect width="800" height="450" fill="#091422"/>
  <defs>
    <pattern id="cadGrid4" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#16253B" stroke-width="0.5"/>
    </pattern>
  </defs>
  <rect width="800" height="450" fill="url(#cadGrid4)"/>
  
  <line x1="30" y1="390" x2="770" y2="390" stroke="#334155" stroke-width="2"/>

  <!-- Ground Station Container -->
  <rect x="100" y="330" width="120" height="60" rx="4" fill="#1E293B" stroke="#64748B" stroke-width="2"/>
  <text x="112" y="365" fill="#F8FAFC" font-family="sans-serif" font-size="11" font-weight="700">KITEPOWER GS</text>
  <!-- Winch Drum inside Container -->
  <circle cx="180" cy="360" r="16" fill="#0284C7" stroke="#38BDF8" stroke-width="2"/>
  
  <!-- High Tension Dyneema Tether -->
  <line x1="180" y1="360" x2="580" y2="100" stroke="#38BDF8" stroke-width="2.5"/>
  <text x="330" y="210" fill="#38BDF8" font-family="sans-serif" font-size="11" transform="rotate(-33, 330, 210)">Dyneema UHMWPE Tether (350 m)</text>

  <!-- Control Pod (Kite Control Unit) -->
  <rect x="565" y="90" width="25" height="14" rx="3" fill="#F59E0B" stroke="#F8FAFC" stroke-width="1"/>
  
  <!-- Inflatable Leading-Edge Power Kite (Cross-wind figure eight) -->
  <path d="M 540 60 Q 600 30 660 65 Q 600 75 540 60 Z" fill="#0284C7" stroke="#38BDF8" stroke-width="2"/>
  <!-- Bridle lines -->
  <line x1="545" y1="62" x2="577" y2="90" stroke="#94A3B8" stroke-width="1"/>
  <line x1="600" y1="52" x2="577" y2="90" stroke="#94A3B8" stroke-width="1"/>
  <line x1="655" y1="66" x2="577" y2="90" stroke="#94A3B8" stroke-width="1"/>

  <!-- Pumping flight path trajectory diagram -->
  <path d="M 510 110 C 470 60, 520 20, 600 40 C 680 60, 720 120, 640 130 C 560 140, 530 110, 510 110" fill="none" stroke="#F59E0B" stroke-dasharray="4,3" stroke-width="1.5"/>
  <text x="620" y="145" fill="#F59E0B" font-family="sans-serif" font-size="10">Crosswind Figure-8 Path</text>

  <!-- Title & Specs -->
  <text x="40" y="45" fill="#F8FAFC" font-family="sans-serif" font-size="16" font-weight="700">KITEPOWER FALCON 100 kW AIRBORNE SYSTEM</text>
  <text x="40" y="67" fill="#38BDF8" font-family="sans-serif" font-size="12">Delft University of Technology / Valkenburg Naval Air Base, Netherlands</text>

  <rect x="40" y="100" width="220" height="75" rx="4" fill="#0E1B2D" stroke="#1E3A5F" stroke-width="1"/>
  <text x="50" y="120" fill="#E2E8F0" font-family="sans-serif" font-size="11" font-weight="600">Two-Phase Pumping Generation</text>
  <text x="50" y="138" fill="#94A3B8" font-family="sans-serif" font-size="10">Rated Output: 100 kW mobile system</text>
  <text x="50" y="153" fill="#94A3B8" font-family="sans-serif" font-size="10">Operating Altitude: 300 m - 450 m AGL</text>
  <text x="50" y="168" fill="#38BDF8" font-family="sans-serif" font-size="10">Material Reduction: 90% vs tower HAWT</text>
</svg>
