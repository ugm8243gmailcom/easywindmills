<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <pattern id="grid-dd" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="rgba(15, 23, 42, 0.06)" stroke-width="0.8"/>
    </pattern>
  </defs>

  <rect width="800" height="450" fill="#f8fafc"/>
  <rect width="800" height="450" fill="url(#grid-dd)"/>

  <!-- Classification Header -->
  <rect x="40" y="24" width="230" height="28" rx="4" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="1"/>
  <text x="52" y="42" fill="#0369a1" font-family="sans-serif" font-weight="700" font-size="11" letter-spacing="0.08em">DRIVETRAIN CONFIGURATION: GROUP B</text>

  <!-- Nacelle Bedplate Outline (Cutaway) -->
  <path d="M 60 110 L 740 110 L 740 350 L 60 350 Z" fill="rgba(241, 245, 249, 0.9)" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="70" y="132" fill="#64748b" font-family="monospace" font-size="10">NACELLE ENCLOSURE CUTAWAY</text>

  <!-- 1. Hub Flange -->
  <path d="M 90 160 L 150 170 L 150 290 L 90 300 Z" fill="#e2e8f0" stroke="#0f172a" stroke-width="2"/>
  <circle cx="120" cy="230" r="16" fill="#0284c7"/>
  <text x="120" y="325" text-anchor="middle" fill="#0f172a" font-family="sans-serif" font-size="11" font-weight="700">Rotor Hub</text>
  <text x="120" y="340" text-anchor="middle" fill="#64748b" font-family="monospace" font-size="9">7-15 RPM</text>

  <!-- Direct Rigid Coupling Flange (NO GEARBOX) -->
  <rect x="150" y="210" width="60" height="40" fill="#cbd5e1" stroke="#0f172a" stroke-width="2"/>
  <line x1="180" y1="180" x2="180" y2="280" stroke="#0284c7" stroke-width="2" stroke-dasharray="4,2"/>
  <text x="180" y="165" text-anchor="middle" fill="#0369a1" font-family="monospace" font-size="9.5" font-weight="700">DIRECT COUPLING</text>

  <!-- Callout: NO GEARBOX REQUIRED -->
  <rect x="220" y="80" width="170" height="26" rx="4" fill="#fef2f2" stroke="#f87171" stroke-width="1"/>
  <text x="305" y="97" text-anchor="middle" fill="#b91c1c" font-family="sans-serif" font-size="10" font-weight="700">NO GEARBOX REQUIRED</text>
  <line x1="305" y1="106" x2="305" y2="135" stroke="#f87171" stroke-width="1.2" stroke-dasharray="3,2"/>

  <!-- 2. Large-Diameter Ring Generator (Low-Speed Multi-Pole) -->
  <!-- Outer Stator Housing -->
  <rect x="230" y="130" width="220" height="200" rx="8" fill="#ffffff" stroke="#0f172a" stroke-width="2.5"/>
  <!-- Multi-Pole Stator Segments -->
  <rect x="245" y="145" width="30" height="170" fill="rgba(2, 132, 199, 0.12)" stroke="#0284c7" stroke-width="1.5"/>
  <rect x="405" y="145" width="30" height="170" fill="rgba(2, 132, 199, 0.12)" stroke="#0284c7" stroke-width="1.5"/>
  <!-- Inner Rotor with Permanent Magnets or Field Windings -->
  <rect x="285" y="160" width="110" height="140" fill="#f1f5f9" stroke="#334155" stroke-width="2"/>
  <circle cx="340" cy="230" r="32" fill="#ffffff" stroke="#0284c7" stroke-width="2"/>
  <text x="340" y="225" text-anchor="middle" fill="#0f172a" font-family="sans-serif" font-size="10" font-weight="700">Low-Speed</text>
  <text x="340" y="240" text-anchor="middle" fill="#0284c7" font-family="monospace" font-size="9">Rotor Shaft</text>

  <text x="340" y="360" text-anchor="middle" fill="#0f172a" font-family="sans-serif" font-size="11" font-weight="700">Large-Diameter Ring Generator</text>
  <text x="340" y="375" text-anchor="middle" fill="#64748b" font-family="sans-serif" font-size="9.5">Multi-Pole Low-Speed Machine (7-15 RPM)</text>

  <!-- 3. Rear Support & Brake -->
  <rect x="460" y="215" width="40" height="30" fill="#94a3b8" stroke="#0f172a" stroke-width="1.5"/>
  <rect x="480" y="195" width="10" height="70" fill="#334155" stroke="#0f172a" stroke-width="1.5"/>
  <text x="485" y="180" text-anchor="middle" fill="#334155" font-family="sans-serif" font-size="9.5" font-weight="600">Holding Brake</text>

  <!-- 4. Full-Scale Power Converter -->
  <path d="M 450 230 L 550 230 L 550 270" fill="none" stroke="#0284c7" stroke-width="2.5"/>
  <rect x="520" y="270" width="170" height="60" rx="4" fill="#ffffff" stroke="#0284c7" stroke-width="2"/>
  <text x="605" y="295" text-anchor="middle" fill="#0f172a" font-family="sans-serif" font-size="10.5" font-weight="700">Full-Scale Power Converter</text>
  <text x="605" y="315" text-anchor="middle" fill="#0369a1" font-family="monospace" font-size="9">100% Grid Frequency Decoupling</text>

  <!-- Technical Summary Footnote -->
  <text x="60" y="420" fill="#475569" font-family="sans-serif" font-size="10.5">
    A direct-drive turbine eliminates the mechanical gearbox between rotor and generator, requiring a larger-diameter, multi-pole generator.
  </text>
</svg>
