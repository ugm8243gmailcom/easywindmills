<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <rect width="800" height="450" fill="#0B1320"/>
  <defs>
    <pattern id="cadGrid1" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#1E293B" stroke-width="0.5"/>
    </pattern>
    <linearGradient id="bladeGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#cadGrid1)"/>
  
  <!-- Ground line -->
  <line x1="50" y1="390" x2="750" y2="390" stroke="#334155" stroke-width="2"/>
  <line x1="100" y1="400" x2="110" y2="390" stroke="#334155" stroke-width="1"/>
  <line x1="120" y1="400" x2="130" y2="390" stroke="#334155" stroke-width="1"/>
  <line x1="140" y1="400" x2="150" y2="390" stroke="#334155" stroke-width="1"/>

  <!-- Steel Lattice Mast -->
  <line x1="380" y1="390" x2="390" y2="190" stroke="#94A3B8" stroke-width="3"/>
  <line x1="420" y1="390" x2="410" y2="190" stroke="#94A3B8" stroke-width="3"/>
  <line x1="380" y1="390" x2="420" y2="390" stroke="#94A3B8" stroke-width="3"/>
  <!-- Bracing -->
  <line x1="383" y1="340" x2="417" y2="340" stroke="#64748B" stroke-width="1.5"/>
  <line x1="386" y1="290" x2="414" y2="290" stroke="#64748B" stroke-width="1.5"/>
  <line x1="388" y1="240" x2="412" y2="240" stroke="#64748B" stroke-width="1.5"/>
  <line x1="383" y1="390" x2="417" y2="340" stroke="#475569" stroke-width="1"/>
  <line x1="417" y1="390" x2="383" y2="340" stroke="#475569" stroke-width="1"/>
  <line x1="383" y1="340" x2="414" y2="290" stroke="#475569" stroke-width="1"/>
  <line x1="417" y1="340" x2="386" y2="290" stroke="#475569" stroke-width="1"/>
  
  <!-- Central Shaft -->
  <rect x="395" y="80" width="10" height="110" fill="#CBD5E1"/>
  
  <!-- Radial Cross Arms -->
  <line x1="240" y1="100" x2="560" y2="100" stroke="#64748B" stroke-width="4"/>
  <line x1="240" y1="170" x2="560" y2="170" stroke="#64748B" stroke-width="4"/>

  <!-- Left Blade with Pitch Actuator -->
  <rect x="232" y="50" width="16" height="170" rx="4" fill="url(#bladeGrad1)" stroke="#38BDF8" stroke-width="1.5"/>
  <circle cx="240" cy="100" r="5" fill="#F8FAFC" stroke="#0284C7" stroke-width="2"/>
  <circle cx="240" cy="170" r="5" fill="#F8FAFC" stroke="#0284C7" stroke-width="2"/>
  <!-- Pitch linkage -->
  <line x1="240" y1="100" x2="260" y2="115" stroke="#F59E0B" stroke-width="2"/>
  <line x1="260" y1="115" x2="395" y2="135" stroke="#F59E0B" stroke-dasharray="4,2" stroke-width="1.5"/>

  <!-- Right Blade -->
  <rect x="552" y="50" width="16" height="170" rx="4" fill="url(#bladeGrad1)" stroke="#38BDF8" stroke-width="1.5"/>
  <circle cx="560" cy="100" r="5" fill="#F8FAFC" stroke="#0284C7" stroke-width="2"/>
  <circle cx="560" cy="170" r="5" fill="#F8FAFC" stroke="#0284C7" stroke-width="2"/>
  <!-- Pitch linkage -->
  <line x1="560" y1="100" x2="540" y2="115" stroke="#F59E0B" stroke-width="2"/>
  <line x1="540" y1="115" x2="405" y2="135" stroke="#F59E0B" stroke-dasharray="4,2" stroke-width="1.5"/>

  <!-- Central Eccentric Cam Pitch Hub -->
  <circle cx="400" cy="135" r="14" fill="#1E293B" stroke="#F59E0B" stroke-width="2"/>
  <circle cx="400" cy="135" r="4" fill="#F59E0B"/>

  <!-- Annotations & Callouts -->
  <text x="40" y="50" fill="#F8FAFC" font-family="sans-serif" font-size="16" font-weight="700">MCDONNELL DOUGLAS 40 kW GIROMILL</text>
  <text x="40" y="72" fill="#38BDF8" font-family="sans-serif" font-size="12">Rocky Flats Wind Test Site (DOE / Rockwell International Prototype)</text>
  
  <line x1="210" y1="90" x2="160" y2="90" stroke="#38BDF8" stroke-width="1"/>
  <text x="60" y="94" fill="#94A3B8" font-family="sans-serif" font-size="11">NACA 0018 Airfoil</text>
  
  <line x1="280" y1="120" x2="300" y2="160" stroke="#F59E0B" stroke-width="1"/>
  <text x="250" y="180" fill="#F59E0B" font-family="sans-serif" font-size="11">Active Cam-Driven Pitch Linkage</text>
  
  <line x1="430" y1="340" x2="490" y2="340" stroke="#94A3B8" stroke-width="1"/>
  <text x="500" y="344" fill="#94A3B8" font-family="sans-serif" font-size="11">Structural Guyed Steel Lattice</text>
  
  <rect x="40" y="310" width="190" height="60" rx="4" fill="#0F172A" stroke="#1E293B" stroke-width="1"/>
  <text x="50" y="330" fill="#E2E8F0" font-family="sans-serif" font-size="11" font-weight="600">Rated Power: 40 kW</text>
  <text x="50" y="348" fill="#94A3B8" font-family="sans-serif" font-size="10">Span: 18.3 m | Chord: 1.5 m</text>
  <text x="50" y="362" fill="#94A3B8" font-family="sans-serif" font-size="10">Control: Cycloturbine Pitch Modulation</text>
</svg>
