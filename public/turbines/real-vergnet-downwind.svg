<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <rect width="800" height="450" fill="#0C1523"/>
  <defs>
    <pattern id="cadGrid3" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#18273E" stroke-width="0.5"/>
    </pattern>
  </defs>
  <rect width="800" height="450" fill="url(#cadGrid3)"/>
  
  <line x1="50" y1="400" x2="750" y2="400" stroke="#334155" stroke-width="2"/>

  <!-- Guy Wires -->
  <line x1="400" y1="150" x2="200" y2="400" stroke="#64748B" stroke-width="2"/>
  <line x1="400" y1="150" x2="600" y2="400" stroke="#64748B" stroke-width="2"/>
  <line x1="400" y1="260" x2="260" y2="400" stroke="#475569" stroke-width="1.5"/>
  <line x1="400" y1="260" x2="540" y2="400" stroke="#475569" stroke-width="1.5"/>

  <!-- Slender Guyed Tubular Mast -->
  <line x1="400" y1="80" x2="400" y2="400" stroke="#CBD5E1" stroke-width="10"/>

  <!-- Wind direction arrow -->
  <line x1="120" y1="85" x2="260" y2="85" stroke="#38BDF8" stroke-width="3"/>
  <polygon points="260,80 275,85 260,90" fill="#38BDF8"/>
  <text x="130" y="75" fill="#38BDF8" font-family="sans-serif" font-size="12" font-weight="600">Incoming Wind Vector</text>

  <!-- Nacelle body -->
  <rect x="380" y="75" width="50" height="22" rx="4" fill="#334155" stroke="#64748B" stroke-width="1.5"/>
  <!-- Rotor Hub positioned DOWNWIND (to the right of tower) -->
  <circle cx="435" cy="86" r="10" fill="#0284C7" stroke="#38BDF8" stroke-width="2"/>
  
  <!-- Flexible Aeroelastic Blades coning downwind -->
  <!-- Upper Blade -->
  <path d="M 435 86 C 455 50, 485 20, 520 10 L 515 8 C 475 22, 445 55, 435 86 Z" fill="#38BDF8" stroke="#7DD3FC" stroke-width="1"/>
  <!-- Lower Blade -->
  <path d="M 435 86 C 455 120, 485 150, 520 165 L 515 167 C 475 148, 445 115, 435 86 Z" fill="#38BDF8" stroke="#7DD3FC" stroke-width="1"/>

  <line x1="435" y1="86" x2="530" y2="86" stroke="#F59E0B" stroke-dasharray="3,3" stroke-width="1"/>
  <text x="480" y="75" fill="#F59E0B" font-family="sans-serif" font-size="10">Coning Angle (10°-15°)</text>

  <!-- Title & Specs -->
  <text x="40" y="45" fill="#F8FAFC" font-family="sans-serif" font-size="16" font-weight="700">VERGNET GEV HP 275 kW DOWNWIND TURBINE</text>
  <text x="40" y="67" fill="#38BDF8" font-family="sans-serif" font-size="12">Ormesson, France / Caribbean Cyclonic Wind Zones</text>

  <rect x="40" y="110" width="220" height="75" rx="4" fill="#0F1E33" stroke="#1E3A5F" stroke-width="1"/>
  <text x="50" y="130" fill="#E2E8F0" font-family="sans-serif" font-size="11" font-weight="600">Aeroelastic Free-Coning Rotor</text>
  <text x="50" y="148" fill="#94A3B8" font-family="sans-serif" font-size="10">Capacity: 275 kW (Two-bladed teetering)</text>
  <text x="50" y="163" fill="#94A3B8" font-family="sans-serif" font-size="10">Survival: Lowered to ground in Cat-5 Cyclones</text>
  <text x="50" y="177" fill="#38BDF8" font-family="sans-serif" font-size="10">Passive aerodynamic free-yaw alignment</text>
</svg>
