<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <pattern id="grid-scig" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="rgba(15, 23, 42, 0.06)" stroke-width="0.8"/>
    </pattern>
  </defs>

  <rect width="800" height="450" fill="#f8fafc"/>
  <rect width="800" height="450" fill="url(#grid-scig)"/>

  <!-- Classification Header -->
  <rect x="40" y="24" width="230" height="28" rx="4" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="1"/>
  <text x="52" y="42" fill="#0369a1" font-family="sans-serif" font-weight="700" font-size="11" letter-spacing="0.08em">GENERATOR TECHNOLOGY: GROUP C</text>

  <!-- SCIG Electrical Schematic Diagram -->
  <rect x="60" y="210" width="100" height="20" fill="#cbd5e1" stroke="#0f172a" stroke-width="2"/>
  <text x="110" y="195" text-anchor="middle" fill="#0f172a" font-family="sans-serif" font-size="11" font-weight="700">High-Speed Shaft</text>
  <text x="110" y="245" text-anchor="middle" fill="#64748b" font-family="monospace" font-size="9">From Gearbox</text>

  <!-- Generator Machine (Squirrel-Cage Rotor) -->
  <circle cx="260" cy="220" r="85" fill="#ffffff" stroke="#0f172a" stroke-width="2.5"/>
  <circle cx="260" cy="220" r="55" fill="#f1f5f9" stroke="#334155" stroke-width="2"/>
  <!-- Conducting bars of squirrel cage -->
  <circle cx="260" cy="180" r="4" fill="#334155"/>
  <circle cx="288" cy="192" r="4" fill="#334155"/>
  <circle cx="300" cy="220" r="4" fill="#334155"/>
  <circle cx="288" cy="248" r="4" fill="#334155"/>
  <circle cx="260" cy="260" r="4" fill="#334155"/>
  <circle cx="232" cy="248" r="4" fill="#334155"/>
  <circle cx="220" cy="220" r="4" fill="#334155"/>
  <circle cx="232" cy="192" r="4" fill="#334155"/>

  <text x="260" y="216" text-anchor="middle" fill="#0f172a" font-family="sans-serif" font-size="11" font-weight="700">SCIG</text>
  <text x="260" y="232" text-anchor="middle" fill="#0369a1" font-family="monospace" font-size="8.5">Short-Circuited Bars</text>

  <!-- Soft Starter and Capacitor Bank -->
  <path d="M 345 220 L 420 220" fill="none" stroke="#0f172a" stroke-width="2.5"/>
  
  <rect x="420" y="180" width="110" height="80" rx="4" fill="#ffffff" stroke="#0284c7" stroke-width="2"/>
  <text x="475" y="212" text-anchor="middle" fill="#0f172a" font-family="sans-serif" font-size="10" font-weight="700">Soft Starter &amp;</text>
  <text x="475" y="228" text-anchor="middle" fill="#0369a1" font-family="sans-serif" font-size="9.5">Capacitor Bank</text>
  <text x="475" y="244" text-anchor="middle" fill="#64748b" font-family="monospace" font-size="8.5">Reactive Support</text>

  <path d="M 530 220 L 620 220" fill="none" stroke="#0f172a" stroke-width="2.5"/>

  <!-- Step-Up Transformer -->
  <rect x="620" y="170" width="110" height="100" rx="6" fill="#ffffff" stroke="#0f172a" stroke-width="2"/>
  <circle cx="675" cy="205" r="16" fill="none" stroke="#0284c7" stroke-width="2"/>
  <circle cx="675" cy="235" r="16" fill="none" stroke="#0284c7" stroke-width="2"/>
  <text x="675" y="285" text-anchor="middle" fill="#0f172a" font-family="sans-serif" font-size="10.5" font-weight="700">Grid Interconnect</text>
  <text x="675" y="300" text-anchor="middle" fill="#64748b" font-family="monospace" font-size="9">Fixed-Speed Operation</text>

  <text x="60" y="420" fill="#475569" font-family="sans-serif" font-size="10.5">
    Squirrel-cage induction machines offer high mechanical simplicity and durability, operating over a narrow slip range (~1-2%) without brushes or rotor slip rings.
  </text>
</svg>
